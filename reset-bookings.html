<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Spot Clinic — Reset Bookings</title><style>body{font-family:Arial,sans-serif;background:#fbfaf5;color:#172019;padding:30px;text-align:center}.box{max-width:620px;margin:40px auto;background:#fff;border:1px solid #ddd;border-radius:20px;padding:28px}button{border:0;border-radius:12px;padding:14px 20px;background:#b42318;color:#fff;font-weight:800;font-size:16px}#s{margin:20px 0;padding:14px;border-radius:12px;background:#eee}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><div class="box"><h1>🗑️ Reset Bookings</h1><p>هذه الصفحة مخصصة لتصفير الحجوزات الحالية فقط.</p><div id="s">جاري التجهيز...</div><button id="go">تصفير كل الحجوزات الآن</button></div><script>const cfg={apiKey:'AIzaSyA6lpUuP_8KHWzzP89ZIpmVts7ABuogGVw',authDomain:'pet-spot-clinic.firebaseapp.com',projectId:'pet-spot-clinic',storageBucket:'pet-spot-clinic.firebasestorage.app',messagingSenderId:'98732499537',appId:'1:98732499537:web:878f3820f40a03151a8e70'};firebase.initializeApp(cfg);const db=firebase.firestore(),s=document.getElementById('s');async function clear(){s.textContent='جاري حذف الحجوزات...';try{const snap=await db.collection('bookings').get();for(let i=0;i<snap.docs.length;i+=400){const b=db.batch();snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}s.textContent='✅ تم حذف '+snap.size+' Booking. العداد الآن يجب أن يكون 0.'}catch(e){s.textContent='❌ فشل الحذف: '+e.message}}document.getElementById('go').onclick=()=>{if(confirm('متأكد؟ سيتم حذف كل الحجوزات الحالية نهائيًا.'))clear()};</script></html>
