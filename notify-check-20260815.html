<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Spot Notify Check</title><body style="font-family:Arial;padding:24px"><h2>Pet Spot notification check</h2><button id="go" style="padding:12px 18px">Send test booking notification</button><pre id="out" style="white-space:pre-wrap;margin-top:20px"></pre><script>const out=document.getElementById('out');document.getElementById('go').onclick=async()=>{out.textContent='Sending...';try{const data={service:'Veterinary Consultation',name:'Notify Test',phone:'01000000000',ownerPhone:'1000000000',petName:'Test Pet',petType:'Dog',date:new Date().toISOString().slice(0,10),time:'10:00',notes:'Temporary notification connectivity test'};const r=await fetch('https://pet-spot-fcm.youssefosama5901.workers.dev/notify',{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({type:'booking',data})});const text=await r.text();out.textContent='HTTP '+r.status+'\n'+text}catch(e){out.textContent='FETCH ERROR\n'+(e.stack||e.message||String(e))}};</script>
