<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Spot Clinic — Admin Notifications</title><style>body{margin:0;background:#fbfaf5;color:#172019;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #e2e8e2;border-radius:20px;padding:24px;box-shadow:0 10px 35px #0001}.status{padding:14px;border-radius:12px;background:#fff1f0;color:#9b2c2c;font-weight:800;margin:15px 0}.status.ok{background:#e8f5ea;color:#063b16}.row{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#063b16;color:#fff}.danger{background:#b42318}.test{background:#0b63ce}.item{border-top:1px solid #e2e8e2;padding:15px 0}.muted{color:#68706b}.badge{display:inline-block;background:#e2f1e5;color:#063b16;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.plus{background:#e8f5ea;color:#063b16}.minus{background:#fdeaea;color:#8b1e1e}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:none;min-width:min(90vw,420px);padding:16px 18px;border-radius:16px;background:#063b16;color:#fff;font-weight:900;box-shadow:0 12px 35px #0004;text-align:center}.toast.show{display:block}h1{font-family:Georgia,serif}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script></head><body><div id="toast" class="toast"></div><div class="wrap"><div class="card"><h1>🔔 Admin Notifications</h1><p class="muted">حل مجاني مؤقت: الصفحة تراقب Firestore لحظيًا. إبقاء الصفحة مفتوحة مطلوب للإشعارات المحلية.</p><div id="status" class="status">جاري الاتصال...</div><div class="row"><button id="allow">🔔 تفعيل الإشعارات</button><button class="test" id="test">🧪 اختبار الإشعار</button><button class="danger" id="clearBookings">🗑️ تصفير كل الحجوزات</button><button onclick="location.href='/pet-spot-clinic/'">العودة للموقع</button></div><div id="list"></div></div></div><script>const firebaseConfig={apiKey:'AIzaSyA6lpUuP_8KHWzzP89ZIpmVts7ABuogGVw',authDomain:'pet-spot-clinic.firebaseapp.com',projectId:'pet-spot-clinic',storageBucket:'pet-spot-clinic.firebasestorage.app',messagingSenderId:'98732499537',appId:'1:98732499537:web:878f3820f40a03151a8e70',measurementId:'G-TY6N10TK80'};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const status=document.getElementById('status'),list=document.getElementById('list'),toast=document.getElementById('toast');const VAPID='BBRGPAmacRAWQlNnu9X5EHO_L97Gbfe3cXVCM0t3YriuLe98a_rK3hzTD5HRIFurmThcuKUOFlWmBXa12hPWTkE';function setStatus(ok,text){status.className='status'+(ok?' ok':'');status.textContent=text}function showToast(text,good=true){toast.textContent=text;toast.style.background=good?'#063b16':'#b42318';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),5000)}function browserNotify(title,body,kind){showToast(title+' — '+body,true);if(Notification.permission==='granted'){try{new Notification(title,{body,icon:'/pet-spot-clinic/icon-192.png',badge:'/pet-spot-clinic/icon-192.png',tag:'petspot-'+kind+'-'+Date.now()})}catch(e){console.log(e)}}}async function registerMessaging(){try{if(!('Notification'in window))throw new Error('المتصفح لا يدعم Web Notifications');const p=await Notification.requestPermission();if(p!=='granted')throw new Error('إذن الإشعارات مرفوض. اسمح به من إعدادات الموقع.');if(!('serviceWorker'in navigator))throw new Error('Service Worker غير مدعوم');const reg=await navigator.serviceWorker.register('/pet-spot-clinic/firebase-messaging-sw.js');const messaging=firebase.messaging();const token=await messaging.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});if(!token)throw new Error('Firebase لم يرجع FCM token');await db.collection('adminPushTokens').doc(token).set({token,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),platform:navigator.platform,userAgent:navigator.userAgent},{merge:true});setStatus(true,'🟢 Notifications are enabled and this device is registered as an Admin device.');showToast('✅ تم تسجيل جهاز الـAdmin بنجاح');messaging.onMessage(payload=>{const n=payload.notification||{};browserNotify(n.title||'Pet Spot Clinic',n.body||'New update','fcm')})}catch(e){setStatus(false,'❌ تعذر تجهيز الإشعارات: '+e.message);showToast('❌ '+e.message,false)}}document.getElementById('allow').onclick=registerMessaging;document.getElementById('test').onclick=async()=>{if(Notification.permission!=='granted'){await registerMessaging();return}browserNotify('🧪 Test Notification','لو شفت الرسالة دي، إشعارات المتصفح شغالة على الجهاز.','test')};function addLog(type,data,kind){const name=data.name||data.customer?.name||data.customerName||'عميل';const service=data.service||data.serviceName||'Booking';const title=type==='booking'?(kind==='plus'?'➕ New Booking':'➖ Booking Removed'):'🛍️ New Order';const body=type==='booking'?(kind==='plus'?`Someone made a booking: ${name} — ${service}`:`Someone removed a booking: ${name} — ${service}`):`${name} قام بإنشاء طلب جديد`;browserNotify(title,body,kind);const el=document.createElement('div');el.className='item';el.innerHTML=`<span class="badge ${kind==='plus'?'plus':kind==='minus'?'minus':''}">${kind==='plus'?'➕ +1':kind==='minus'?'➖ -1':type==='booking'?'Booking':'Order'}</span> <b>${name}</b><div class="muted">${body}</div>`;list.prepend(el)}function listenBookings(){let ready=false;db.collection('bookings').onSnapshot(snap=>{if(!ready){ready=true;setStatus(true,'🟢 متصل — في انتظار تغييرات الحجوزات...');return}snap.docChanges().forEach(ch=>{if(ch.type==='added')addLog('booking',ch.doc.data(),'plus');if(ch.type==='removed')addLog('booking',ch.doc.data(),'minus')})},err=>setStatus(false,'❌ تعذر قراءة bookings: '+err.message))}function listenOrders(){let ready=false;db.collection('orders').onSnapshot(snap=>{if(!ready){ready=true;return}snap.docChanges().forEach(ch=>{if(ch.type==='added')addLog('order',ch.doc.data(),'plus')})},err=>setStatus(false,'❌ تعذر قراءة orders: '+err.message))}async function clearCollection(col){const snap=await db.collection(col).get();for(let i=0;i<snap.docs.length;i+=400){const batch=db.batch();snap.docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));await batch.commit()}return snap.size}document.getElementById('clearBookings').onclick=async()=>{if(!confirm('متأكد إنك عايز تمسح كل الحجوزات الحالية؟ لا يمكن التراجع عن الحذف.'))return;try{setStatus(false,'جاري حذف كل الحجوزات...');const n=await clearCollection('bookings');setStatus(true,'🟢 تم تصفير الحجوزات بنجاح: '+n);showToast('🗑️ تم حذف '+n+' Booking')}catch(e){setStatus(false,'❌ تعذر حذف الحجوزات: '+e.message)}};listenBookings();listenOrders();</script></body></html>
