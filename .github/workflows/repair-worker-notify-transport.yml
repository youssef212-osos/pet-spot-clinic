name: Repair Worker Notify Transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch notify transport and normalize worker version
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = False

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = "const response=await fetch(PETSPOT_FCM_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})});"
          new = "const response=await fetch(PETSPOT_FCM_WORKER_URL,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({type,data})});"
          if old in s and 'text/plain;charset=UTF-8' not in s:
              s = s.replace(old, new, 1)
              changed = True
          index.write_text(s, encoding='utf-8')

          worker = Path('cloudflare-worker-fcm.js')
          w = worker.read_text(encoding='utf-8')

          # Keep exactly one worker version declaration, using V3.
          w2 = re.sub(r"\n?const WORKER_VERSION\s*=\s*['\"]notify-transport-[^'\"]+['\"];\n?", "\n", w)
          site = "const SITE_URL = 'https://youssef212-osos.github.io/pet-spot-clinic/';"
          if "const WORKER_VERSION = 'notify-transport-v3';" not in w2:
              w2 = w2.replace(site, site + "\nconst WORKER_VERSION = 'notify-transport-v3';", 1)
          if w2 != w:
              w = w2
              changed = True

          # Keep only one GET /notify diagnostic block.
          notify_pattern = re.compile(
              r"\n    if \(request\.method === 'GET' && url\.pathname === '/notify'\) \{\n"
              r"      return json\(\{ ok: true, service: 'notify', workerVersion: WORKER_VERSION, accepts: 'POST', requestId \}\);\n"
              r"    \}\n"
          )
          notify_block = "\n    if (request.method === 'GET' && url.pathname === '/notify') {\n      return json({ ok: true, service: 'notify', workerVersion: WORKER_VERSION, accepts: 'POST', requestId });\n    }\n"
          w2 = notify_pattern.sub('', w)
          marker = "    if (request.method === 'GET' && url.pathname === '/telegram') {"
          if marker in w2 and notify_block.strip() not in w2:
              w2 = w2.replace(marker, notify_block + "\n" + marker, 1)
          if w2 != w:
              w = w2
              changed = True

          worker.write_text(w, encoding='utf-8')

          if not changed:
              print('No changes needed; repair already applied.')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloudflare-worker-fcm.js
          git diff --cached --quiet || git commit -m "fix: normalize worker notify transport"
          git push
