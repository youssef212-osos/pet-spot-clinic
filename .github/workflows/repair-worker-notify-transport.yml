name: Repair Worker Notify Transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore cancellation-capable worker
        run: |
          cp "cloudflare-worker-fcm (1).js" cloudflare-worker-fcm.js

      - name: Commit worker repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-fcm.js
          git diff --cached --quiet || git commit -m "fix: support booking and order deletion notifications"
          git push
