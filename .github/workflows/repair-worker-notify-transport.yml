name: Repair Worker Notify Transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch notify transport and deletion notification types
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = False

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = "const response=await fetch(PETSPOT_FCM_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})});"
          new = "const response=await fetch(PETSPOT_FCM_WORKER_URL,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({type,data})});"
          if old in s and 'text/plain;charset=UTF-8' not in s:
              s = s.replace(old, new, 1)
              changed = True
          index.write_text(s, encoding='utf-8')

          worker = Path('cloudflare-worker-fcm.js')
          w = worker.read_text(encoding='utf-8')

          # Accept the exact deletion event names sent by the current index.html.
          old_types = "if (!['booking', 'booking_removed', 'order', 'order_removed'].includes(type)) {"
          new_types = "if (!['booking', 'booking_removed', 'booking_deleted_by_customer', 'booking_deleted_by_admin', 'order', 'order_removed', 'order_deleted_by_customer', 'order_deleted_by_admin'].includes(type)) {"
          if old_types in w:
              w = w.replace(old_types, new_types, 1)
              changed = True

          # Give deletion events an explicit deletion notification instead of
          # falling through to the New Order message.
          old_build = """function buildNotification(type, data) {
  const name = data.name || data.customerName || data.customer?.name || 'Customer';
  if (type === 'booking_removed') return { title: '➖ Booking Removed', body: `${name} removed ${data.service || data.serviceName || 'Booking'}` };
  if (type === 'booking') return { title: '➕ New Booking', body: `${name} booked ${data.service || data.serviceName || 'Booking'}` };
  if (type === 'order_removed') return { title: '➖ Order Removed', body: `${name} removed an order` };
  const number = data.orderNumber ? ` #${data.orderNumber}` : '';
  return { title: '➕ New Order', body: `${name} placed a new order${number}` };
}"""
          new_build = """function buildNotification(type, data) {
  const booking = data.booking || {};
  const order = data.order || {};
  const name = data.name || data.customerName || data.customer?.name || booking.name || order.customer?.name || 'Customer';
  const phone = data.ownerPhone || booking.ownerPhone || booking.phone || order.customer?.ownerPhone || order.customer?.phone || '';
  if (type === 'booking_deleted_by_customer' || type === 'booking_deleted_by_admin' || type === 'booking_removed') {
    return { title: '🗑️ Booking Cancelled', body: `${name} cancelled a booking${phone ? ` — ${phone}` : ''}` };
  }
  if (type === 'order_deleted_by_customer' || type === 'order_deleted_by_admin' || type === 'order_removed') {
    return { title: '🗑️ Order Cancelled', body: `${name} cancelled an order${phone ? ` — ${phone}` : ''}` };
  }
  if (type === 'booking') return { title: '➕ New Booking', body: `${name} booked ${data.service || data.serviceName || booking.service || 'Booking'}` };
  const number = data.orderNumber ? ` #${data.orderNumber}` : '';
  return { title: '➕ New Order', body: `${name} placed a new order${number}` };
}"""
          if old_build in w:
              w = w.replace(old_build, new_build, 1)
              changed = True

          worker.write_text(w, encoding='utf-8')

          if not changed:
              print('No changes needed; repair already applied.')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloudflare-worker-fcm.js
          git diff --cached --quiet || git commit -m "fix: support booking and order deletion notifications"
          git push
