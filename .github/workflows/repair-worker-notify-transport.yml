name: Repair Worker Notify Transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch notify transport and add worker diagnostic
        shell: python
        run: |
          from pathlib import Path

          changed = False

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = "const response=await fetch(PETSPOT_FCM_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data})});"
          new = "const response=await fetch(PETSPOT_FCM_WORKER_URL,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({type,data})});"
          if old in s and 'text/plain;charset=UTF-8' not in s:
              s = s.replace(old, new, 1)
              changed = True
          index.write_text(s, encoding='utf-8')

          worker = Path('cloudflare-worker-fcm.js')
          w = worker.read_text(encoding='utf-8')
          if "const WORKER_VERSION = 'notify-transport-v2';" not in w:
              w = w.replace("const SITE_URL = 'https://youssef212-osos.github.io/pet-spot-clinic/';", "const SITE_URL = 'https://youssef212-osos.github.io/pet-spot-clinic/';\nconst WORKER_VERSION = 'notify-transport-v2';", 1)
              marker = "    if (request.method === 'GET' && url.pathname === '/telegram') {"
              diagnostic = "    if (request.method === 'GET' && url.pathname === '/notify') {\n      return json({ ok: true, service: 'notify', workerVersion: WORKER_VERSION, accepts: 'POST', requestId });\n    }\n\n"
              w = w.replace(marker, diagnostic + marker, 1)
              w = w.replace("        total: results.length,\n        results\n      });", "        total: results.length,\n        results,\n        workerVersion: WORKER_VERSION\n      });", 1)
              changed = True
          worker.write_text(w, encoding='utf-8')

          if not changed:
              print('No changes needed; repair already applied.')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloudflare-worker-fcm.js
          git diff --cached --quiet || git commit -m "fix: make worker notify request CORS-safe"
          git push
