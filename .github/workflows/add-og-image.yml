name: Add site preview image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-og-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Open Graph metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          meta = '''<meta property="og:type" content="website">
          <meta property="og:title" content="Pet Spot Clinic">
          <meta property="og:description" content="Pet Spot Clinic - Pets meet for a treat">
          <meta property="og:image" content="https://youssef212-osos.github.io/pet-spot-clinic/petspot-favicon.jpg?v=4">
          <meta property="og:url" content="https://youssef212-osos.github.io/pet-spot-clinic/">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Pet Spot Clinic">
          <meta name="twitter:description" content="Pet Spot Clinic - Pets meet for a treat">
          <meta name="twitter:image" content="https://youssef212-osos.github.io/pet-spot-clinic/petspot-favicon.jpg?v=4">'''
          if 'property="og:image"' not in s:
              if marker not in s:
                  raise SystemExit('viewport marker not found')
              s = s.replace(marker, marker + '\n' + meta, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add social preview image metadata"
          git push
