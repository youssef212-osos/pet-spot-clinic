name: Patch My Orders and Notifications

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Worker browser authorization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cloudflare-worker-fcm.js")
          text = path.read_text(encoding="utf-8")

          old = """    const secret = env.NOTIFY_SECRET;
              if (secret && (request.headers.get('X-PetSpot-Notify-Secret') || '') !== secret) {
                return json({ ok: false, requestId, error: 'Unauthorized' }, 401);
              }"""

          new = """    const secret = env.NOTIFY_SECRET;
              const origin = request.headers.get('Origin') || '';
              const isPetSpotBrowser = origin === 'https://youssef212-osos.github.io';
              if (secret && !isPetSpotBrowser && (request.headers.get('X-PetSpot-Notify-Secret') || '') !== secret) {
                return json({ ok: false, requestId, error: 'Unauthorized' }, 401);
              }"""

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Worker authorization patch applied.")
          else:
              print("Worker authorization block already patched or not found; leaving file unchanged.")
          PY

      - name: Patch index deletion notifications
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = '''async function deleteBooking(id){
            try{
              if(firebaseConfigured){
                await db.collection('bookings').doc(String(id)).delete();
              }else{
                setBookings(getBookings().filter(x=>String(x.id)!==String(id)));
                renderAdmin();
                updateBookingTimes();
              }
            }catch(err){
              console.error('Delete booking:',err);
              alert(lang==='ar'?'تعذر حذف الحجز.':'Could not delete the booking.');
            }
          }
          async function deleteOrder(id){if(!confirm(lang==='ar'?'هل تريد حذف هذا الطلب؟':'Delete this order?'))return;if(firebaseConfigured)await db.collection('orders').doc(String(id)).delete();else{orders=orders.filter(x=>x.id!==id);localStorage.setItem('petspotOrders',JSON.stringify(orders));renderAdmin()}}'''

          new = '''async function deleteBooking(id){
            try{
              let booking=null;
              if(firebaseConfigured){
                const ref=db.collection('bookings').doc(String(id));
                const snap=await ref.get();
                booking=snap.exists?{id:String(id),...snap.data()}:{id:String(id)};
                await ref.delete();
              }else{
                booking=getBookings().find(x=>String(x.id)===String(id))||{id:String(id)};
                setBookings(getBookings().filter(x=>String(x.id)!==String(id)));
                renderAdmin();
                updateBookingTimes();
              }
              if(firebaseConfigured){renderAdmin();updateBookingTimes();}
              try{
                const notifyResult=await notifyPetSpot('booking_removed',booking);
                console.log('Booking removal notification sent:',notifyResult);
              }catch(notifyErr){
                console.error('Booking removal notification:',notifyErr);
              }
            }catch(err){
              console.error('Delete booking:',err);
              alert(lang==='ar'?'تعذر حذف الحجز.':'Could not delete the booking.');
            }
          }
          async function deleteOrder(id){
            if(!confirm(lang==='ar'?'هل تريد حذف هذا الطلب؟':'Delete this order?'))return;
            try{
              let order=null;
              if(firebaseConfigured){
                const ref=db.collection('orders').doc(String(id));
                const snap=await ref.get();
                order=snap.exists?{id:String(id),...snap.data()}:{id:String(id)};
                await ref.delete();
              }else{
                order=orders.find(x=>String(x.id)===String(id))||{id:String(id)};
                orders=orders.filter(x=>String(x.id)!==String(id));
                localStorage.setItem('petspotOrders',JSON.stringify(orders));
                renderAdmin();
              }
              if(firebaseConfigured)renderAdmin();
              try{
                const notifyResult=await notifyPetSpot('order_removed',order);
                console.log('Order removal notification sent:',notifyResult);
              }catch(notifyErr){
                console.error('Order removal notification:',notifyErr);
              }
            }catch(err){
              console.error('Delete order:',err);
              alert(lang==='ar'?'تعذر حذف الطلب.':'Could not delete the order.');
            }
          }'''

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Index deletion notification patch applied.")
          elif "notifyPetSpot('booking_removed'" in text and "notifyPetSpot('order_removed'" in text:
              print("Index deletion notification patch already applied.")
          else:
              raise SystemExit("Could not find the deletion functions in index.html")
          PY

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-fcm.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: notify Telegram when bookings or orders are deleted"
            git push
          fi
