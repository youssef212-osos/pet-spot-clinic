name: Repair Admin Notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a visible notification status card to the admin dashboard.
          marker = '<div class="adminStats">'
          status = '''<div id="notificationStatus" class="notice show" style="display:block;margin:18px 0;background:#fff8df;color:#6b5600;border:1px solid #f0d77a"><strong>🔔 Notifications:</strong> <span id="notificationStatusText">Checking notification permission…</span></div>\n'''
          if 'id="notificationStatus"' not in s:
              s = s.replace(marker, status + marker, 1)

          start = s.find('async function registerAdminPush(){')
          end = s.find('\n\nconst AR=', start)
          if start != -1 and end != -1:
              new_fn = r'''async function registerAdminPush(){
  const status=document.getElementById('notificationStatusText');
  const setStatus=(text,kind)=>{
    if(!status)return;
    status.textContent=text;
    const box=document.getElementById('notificationStatus');
    if(box){box.style.background=kind==='ok'?'#e8f5ea':kind==='bad'?'#fdeaea':'#fff8df';box.style.color=kind==='ok'?'#063b16':kind==='bad'?'#8b1e1e':'#6b5600';box.style.borderColor=kind==='ok'?'#b8dfbf':kind==='bad'?'#f0b5b5':'#f0d77a'}
  };
  if(!firebaseConfigured){setStatus(lang==='ar'?'Firebase غير مُعد.':'Firebase is not configured.','bad');return false;}
  if(!('Notification' in window)){setStatus(lang==='ar'?'هذا المتصفح لا يدعم الإشعارات.':'This browser does not support notifications.','bad');return false;}
  if(!('serviceWorker' in navigator)){setStatus(lang==='ar'?'Service Worker غير متاح.':'Service Worker is unavailable.','bad');return false;}
  try{
    if(Notification.permission==='denied'){setStatus(lang==='ar'?'الإشعارات محظورة من إعدادات المتصفح.':'Notifications are blocked in browser settings.','bad');return false;}
    setStatus(lang==='ar'?'جاري تفعيل الإشعارات…':'Enabling notifications…','wait');
    const permission=await Notification.requestPermission();
    if(permission!=='granted'){setStatus(lang==='ar'?'لم يتم السماح بالإشعارات.':'Notification permission was not granted.','bad');return false;}
    const swUrl='/pet-spot-clinic/firebase-messaging-sw.js';
    const registration=await navigator.serviceWorker.register(swUrl,{scope:'/pet-spot-clinic/'});
    await navigator.serviceWorker.ready;
    firebaseMessaging=firebase.messaging();
    const tokenOptions={serviceWorkerRegistration:registration};
    if(window.PETSPOT_FCM_VAPID_KEY && !window.PETSPOT_FCM_VAPID_KEY.startsWith('YOUR_')) tokenOptions.vapidKey=window.PETSPOT_FCM_VAPID_KEY;
    adminPushToken=await firebaseMessaging.getToken(tokenOptions);
    if(!adminPushToken) throw new Error('FCM token was not returned');
    await db.collection('adminPushTokens').doc(adminPushToken).set({token:adminPushToken,enabled:true,updatedAt:new Date().toISOString(),userAgent:navigator.userAgent},{merge:true});
    setStatus(lang==='ar'?'الإشعارات مفعّلة والجهاز مسجل كجهاز Admin.':'Notifications are enabled and this device is registered as an Admin device.','ok');
    firebaseMessaging.onMessage(payload=>{
      const n=payload.notification||{};
      const title=n.title||'Pet Spot Clinic';
      const body=n.body||'';
      if(Notification.permission==='granted') new Notification(title,{body,icon:n.icon||'/pet-spot-clinic/icon-192.png'});
    });
    return true;
  }catch(err){
    console.error('FCM setup:',err);
    setStatus((lang==='ar'?'تعذر تفعيل الإشعارات: ':'Could not enable notifications: ')+(err.message||'Unknown error'),'bad');
    return false;
  }
}'''
              s = s[:start] + new_fn + s[end:]

          # Replace the bookings listener with realtime cross-device updates + foreground notification.
          old = """db.collection('bookings').orderBy('createdAt','desc').onSnapshot(snapshot=>{\n      cloudBookings=snapshot.docs.map(d=>({id:d.id,...d.data()}));\n      bookingsCloudReady=true;\n      localStorage.setItem('petspotBookings',JSON.stringify(cloudBookings));\n      renderAdmin();\n      updateBookingTimes();\n    },err=>{\n      console.error('Bookings listener:',err);\n      bookingsCloudReady=false;\n    });"""
          new = """let firstBookingsSnapshot=true;\n    db.collection('bookings').orderBy('createdAt','desc').onSnapshot(snapshot=>{\n      const nextBookings=snapshot.docs.map(d=>({id:d.id,...d.data()}));\n      if(!firstBookingsSnapshot){\n        const previousIds=new Set(cloudBookings.map(x=>String(x.id)));\n        nextBookings.filter(x=>!previousIds.has(String(x.id))).forEach(x=>{\n          const title=lang==='ar'?'📅 حجز جديد في Pet Spot':'📅 New Pet Spot Booking';\n          const body=`${x.service||'Appointment'} • ${x.name||'Customer'} • ${x.date||''} ${x.time||''}`.trim();\n          if(Notification.permission==='granted') new Notification(title,{body,icon:'/pet-spot-clinic/icon-192.png'});\n        });\n      }\n      firstBookingsSnapshot=false;\n      cloudBookings=nextBookings;\n      bookingsCloudReady=true;\n      localStorage.setItem('petspotBookings',JSON.stringify(cloudBookings));\n      renderAdmin();\n      updateBookingTimes();\n    },err=>{\n      console.error('Bookings listener:',err);\n      bookingsCloudReady=false;\n    });"""
          if old in s:
              s=s.replace(old,new,1)

          # Make booking deletion work against Firestore and ask for confirmation.
          start=s.find('async function deleteBooking(id){')
          end=s.find('\nasync function deleteOrder',start)
          if start!=-1 and end!=-1:
              fn=r'''async function deleteBooking(id){
  if(!confirm(lang==='ar'?'هل تريد حذف هذا الحجز؟':'Delete this booking?'))return;
  try{
    if(firebaseConfigured){
      await db.collection('bookings').doc(String(id)).delete();
    }else{
      setBookings(getBookings().filter(x=>String(x.id)!==String(id)));
      renderAdmin();
      updateBookingTimes();
    }
  }catch(err){
    console.error('Delete booking:',err);
    alert(lang==='ar'?'تعذر حذف الحجز. تأكد من صلاحيات Firestore.':'Could not delete the booking. Check Firestore permissions.');
  }
}'''
              s=s[:start]+fn+s[end:]

          p.write_text(s,encoding='utf-8')

      - name: Commit repaired site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: admin notification status and booking deletion"
          git push
